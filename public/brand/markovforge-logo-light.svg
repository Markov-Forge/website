<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgLightForge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>

    <!-- Forge Flame Gradient -->
    <linearGradient id="forgeFlameLight" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E11D48" />
      <stop offset="50%" stop-color="#EA580C" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <linearGradient id="forgeGoldLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Steel Gradients -->
    <linearGradient id="steelLightFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>

    <!-- Subtle Shadow -->
    <filter id="softShadowLight" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="960" height="280" rx="28" fill="url(#bgLightForge)" />
  <rect width="956" height="276" x="2" y="2" rx="26" fill="none" stroke="#E2E8F0" stroke-width="1.5" />

  <!-- LOGO EMBLEM -->
  <g transform="translate(140, 140) scale(0.68) translate(-256, -256)" filter="url(#softShadowLight)">
    <!-- Ambient Backdrop Glow -->
    <circle cx="256" cy="260" r="130" fill="#EA580C" opacity="0.08" />

    <!-- Geometric Anvil Base -->
    <g transform="translate(0, 10)">
      <path d="M 146 376 L 366 376 L 340 336 L 172 336 Z" fill="url(#steelLightFacet)" stroke="#334155" stroke-width="2" />
      <path d="M 172 336 L 340 336 L 316 260 L 196 260 Z" fill="#0F172A" stroke="#1E293B" stroke-width="2" />
      <path d="M 216 336 L 256 260 L 296 336 Z" fill="#334155" opacity="0.6" />
    </g>

    <!-- Markov Flow Arcs -->
    <g>
      <!-- S0 -> S1 -->
      <path d="M 175 255 C 160 185, 215 140, 256 140" fill="none" stroke="url(#forgeFlameLight)" stroke-width="5" stroke-linecap="round" stroke-dasharray="6,4" />
      <polygon points="256,134 268,140 256,146" fill="#EA580C" />

      <!-- S1 -> S2 -->
      <path d="M 256 140 C 297 140, 352 185, 337 255" fill="none" stroke="url(#forgeFlameLight)" stroke-width="5" stroke-linecap="round" />
      <polygon points="334,260 342,248 330,248" fill="#EA580C" transform="rotate(15, 337, 255)" />

      <!-- S2 -> S0 Loop -->
      <path d="M 337 255 C 310 325, 202 325, 175 255" fill="none" stroke="url(#forgeFlameLight)" stroke-width="5" stroke-linecap="round" />
      <polygon points="175,250 183,262 171,262" fill="#D97706" transform="rotate(-20, 175, 255)" />

      <!-- Self-Loop on S1 -->
      <path d="M 244 135 C 235 95, 277 95, 268 135" fill="none" stroke="#F59E0B" stroke-width="3.5" stroke-linecap="round" />
    </g>

    <!-- Markov Nodes -->
    <g>
      <!-- S0 -->
      <g transform="translate(170, 255)">
        <circle cx="0" cy="0" r="26" fill="#FFFFFF" stroke="url(#forgeFlameLight)" stroke-width="4" />
        <circle cx="0" cy="0" r="14" fill="url(#forgeGoldLight)" />
        <circle cx="0" cy="0" r="5" fill="#FFFFFF" />
      </g>
      <!-- S2 -->
      <g transform="translate(342, 255)">
        <circle cx="0" cy="0" r="26" fill="#FFFFFF" stroke="url(#forgeFlameLight)" stroke-width="4" />
        <circle cx="0" cy="0" r="14" fill="url(#forgeGoldLight)" />
        <circle cx="0" cy="0" r="5" fill="#FFFFFF" />
      </g>
      <!-- S1 -->
      <g transform="translate(256, 140)">
        <circle cx="0" cy="0" r="30" fill="#FFFBEB" stroke="url(#forgeFlameLight)" stroke-width="4.5" />
        <circle cx="0" cy="0" r="16" fill="url(#forgeFlameLight)" />
        <circle cx="0" cy="0" r="6" fill="#FFFFFF" />
      </g>
      <!-- Core Energy -->
      <polygon points="256,235 274,268 238,268" fill="url(#forgeFlameLight)" opacity="0.9" />
      <circle cx="256" cy="257" r="7" fill="#FFFFFF" />
    </g>

    <!-- Sparks -->
    <g opacity="0.9">
      <circle cx="210" cy="98" r="3" fill="#F59E0B" />
      <circle cx="304" cy="92" r="2.5" fill="#EA580C" />
      <circle cx="256" cy="65" r="3.5" fill="#D97706" />
    </g>
  </g>

  <!-- WORDMARK & TYPOGRAPHY -->
  <g transform="translate(260, 0)">
    <!-- Brand Name -->
    <text x="0" y="145" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="800" font-size="64" letter-spacing="-1">
      <tspan fill="#0F172A">MARKOV</tspan><tspan fill="url(#forgeFlameLight)">FORGE</tspan><tspan fill="#94A3B8" font-weight="400" font-size="38">.COM</tspan>
    </text>

    <!-- Subtitle / Positioning Tagline -->
    <text x="4" y="185" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="700" font-size="14.5" letter-spacing="4.5" fill="#475569">
      AGENT HARNESS &amp; SYSTEMS ENGINEERING
    </text>

    <!-- Accent Underline Track -->
    <rect x="4" y="204" width="460" height="2" rx="1" fill="#E2E8F0" />
    <rect x="4" y="204" width="130" height="2" rx="1" fill="url(#forgeFlameLight)" />

    <!-- Feature Pillars Badges -->
    <g transform="translate(4, 222)" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#64748B">
      <text x="0" y="0">ORCHESTRATION</text>
      <circle cx="112" cy="-3.5" r="2" fill="#EA580C" />
      <text x="124" y="0">RLHF</text>
      <circle cx="170" cy="-3.5" r="2" fill="#EA580C" />
      <text x="182" y="0">LLM SERVING</text>
      <circle cx="278" cy="-3.5" r="2" fill="#EA580C" />
      <text x="290" y="0">CLOUD-NATIVE</text>
    </g>
  </g>
</svg>
